<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Attendance Calculator for students who want to calculate their attendance percentage and the recovery periods needed."
        />
        <meta
            name="keywords"
            content="Calculator, School, Attendance, Frequency Calculator, Students"
        />
        <meta name="author" content="GregSaid" />
        <title>Frequency Calculator</title>
        <link rel="shortcut icon" href="../ico/Tool.ico" type="image/x-icon" />
        <link rel="stylesheet" href="../Code/CSS/Frequency Calculator.css" />
        <script src="../Code/JS/Frequency Calculator.js"></script>
    </head>
    <body>
        <div class="container">
            <div class="close-btn">
                <a href="../index.html">
                    <img src="../Code/CSS/img/Icons/Close.png" alt="Close" />
                </a>
            </div>

            <h1>Attendance Calculator</h1>
            <form id="presencaForm">
                <label for="total-aulas">Total number of school days:</label>
                <input
                    type="number"
                    id="total-aulas"
                    inputmode="numeric"
                    required
                    oninput="validarNumerosInteiros(this); atualizarPresencas(); OcultarAprovado(); OcultarResultado();"
                    onkeypress="return CheckChar(event)"
                />

                <label for="presencas">Total number of classes attended:</label>
                <input
                    type="number"
                    id="presencas"
                    inputmode="numeric"
                    required
                    oninput="validarNumerosInteiros(this); validarPresencas(); OcultarAprovado(); OcultarResultado();"
                    onkeypress="return CheckChar(event)"
                />

                <label for="percentual-minimo"
                    >Minimum required attendance percentage:</label
                >
                <input
                    type="number"
                    id="percentual-minimo"
                    inputmode="numeric"
                    required
                    oninput="LimitarNumeros(this); validarvalorMaximo(this); OcultarAprovado(); OcultarResultado();"
                    onkeypress="return CheckChar(event)"
                />

                <button type="button" onclick="calcular()">Calculate</button>
            </form>

            <p id="erro" class="erro"></p>
            <h2 id="resultado" class="resultado"></h2>
        </div>
    </body>
</html>
